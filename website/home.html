<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <style>
        body {
            background: url('./img/10_uu_the_01.jpg') no-repeat center center/cover;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; text-align: center;
        }
        
        .container {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(to bottom, #72a7dc, #0037ff);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center; 
        }
        
        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }
        
        .profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            background-color: #ccc;
        }   
        .container img {

            width: 150px; margin-bottom: 10px;
        }
        
        .info {
            flex-grow: 1;
            text-align: left;
            margin-left: 10px;
        }
        
        .membership, .features, .settings {
            margin-top: 20px;
        }
        
        .levels {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        
        .level {
            background: white;
            color: black;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .feature, .setting {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .feature i, .setting i {
            margin-right: 10px;
        }
        
        .logout {
            background: rgba(255, 0, 0, 0.7);
            color: white;
        }
        
        .qr-btn {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }
        .profile label {
            cursor: pointer;
        }
        
        .profile input {
            display: none;
        }
        .profile i {
            font-size: 50px;
            color: white;
            background-color: #ccc;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
    </style>
    <div class="container">
        <header>
            <div class="profile">
                <label for="avatarUpload">
                    <img id="avatarPreview" src="avatar.png" alt="Avatar" onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='flex';">
                    <i id="defaultIcon" class="fa fa-user"></i>
                </label>
                <input type="file" id="avatarUpload" accept="image/*" hidden>
    
                <div class="info">
                    <h2>Đào Hoàng Nhân</h2>
                    <p>Thành viên - 211A290031</p>
                </div>
            </div>
            <img src="./img/images.png" alt="University Logo" class="logo">
         
        </header>
        
        <section class="membership">
            <h3>Bậc thành viên</h3>
            <div class="levels">
                <div class="level">Bạc</div>
                <div class="level">Vàng</div>
                <div class="level">Kim Cương</div>
            </div>
        </section>
        
        <section class="features">
            <h3>Chức năng chính</h3>
            <div class="feature"><i class="fas fa-car"></i> Trạng thái xe</div>
            <div class="feature"><i class="fas fa-user"></i> Thông tin người dùng</div>
            <div class="feature"><i class="fas fa-history"></i> Lịch sử xe tháng</div>
        </section>
        
        <section class="settings">
            <h3>Thiết lập</h3>
            <div class="setting"><i class="fas fa-headset"></i> Trung tâm hỗ trợ</div>
            <div class="setting"><i class="fas fa-cog"></i> Thiết lập tài khoản</div>
            <div class="setting"><i class="fas fa-lock"></i> Đổi mật khẩu</div>
            <div class="setting logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</div>
        </section>
        
        <button class="qr-btn">Mã QR</button>
    </div>
    <script>
        document.getElementById("avatarUpload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("avatarPreview").src = e.target.result;
                    document.getElementById("avatarPreview").style.display = "block";
                    document.getElementById("defaultIcon").style.display = "none";
                };
                reader.readAsDataURL(file);
            }
        });
        
    </script>
</body>
</html>
