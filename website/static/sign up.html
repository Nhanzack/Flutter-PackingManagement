<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="./css/js/logstyle.css">
</head>
<body>
    <div class="container-signup">
        <img src="../img/images.png" alt="Logo">
        <h2>Chào mừng</h2>
        <p>Đăng ký tài khoản của bạn!</p>
        <form id="registerForm" onsubmit="return validateForm(event)">
            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="mssv" placeholder="MSSV" required>
                <span class="error" id="mssvError"></span>
            </div>
            <div class="input-group">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
                <span class="error" id="emailError"></span>
            </div>
            <div class="input-group">
                <i class="fa fa-phone"></i>
                <input type="text" id="phone" placeholder="Phone number" required>
                <span class="error" id="phoneError"></span>
            </div>
            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
                <span class="error" id="passwordError"></span>
            </div>
            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <span class="error" id="confirmPasswordError"></span>
            </div>
            <button type="submit">Đăng Ký</button>  
        </form>
        <p class="login-link">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
    </div>

    <script src="./css/js/signup.js"></script>
</body>
</html>
