<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Quản Lý Bãi Xe</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <!-- Phần trên với hình ảnh -->
        <div class="header">
            <img src="./img/10_uu_the_01.jpg" alt="Trường Đại Học" class="header-img">
           <div class="overlay">
                <img src="./img/images.png" alt="Logo" class="logo">
            </div>
          </div>

        <!-- Nội dung chính -->
        <div class="content">
            <h1>Chào Mừng</h1>
            <img src="./img/local_taxi.png" alt="Biểu tượng xe" class="car-icon">
            <p>Ứng dụng quản lý bãi xe</p>

            <!-- Nút Login và SignUp -->
            <button id="loginBtn" class="btn btn-login">Login</button>
            
            <button id="signupBtn" class="btn btn-signup">SignUp</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
