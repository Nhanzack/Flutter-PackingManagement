<script>
    document.addEventListener("DOMContentLoaded", function() {
        const forgotPasswordLink = document.querySelector(".forgot-password");
        const forgotPasswordModal = document.getElementById("forgotPasswordModal");
        const backButton = document.querySelector(".back-btn");
    
        // Hiển thị modal khi nhấn "Forgot Password?"
        forgotPasswordLink.addEventListener("click", function(event) {
            event.preventDefault(); // Ngăn chặn load lại trang
            forgotPasswordModal.classList.remove("hidden");
        });
    
        // Ẩn modal khi nhấn nút "back"
        backButton.addEventListener("click", function() {
            forgotPasswordModal.classList.add("hidden");
        });
    });
    document.addEventListener("DOMContentLoaded", function() {
        const forgotPasswordLink = document.querySelector(".recorver-acount");
        const forgotPasswordModal = document.getElementById("recorverpassword");
        const backButton = document.querySelector(".back-btn");
    
        // Hiển thị modal khi nhấn "Forgot Password?"
        forgotPasswordLink.addEventListener("click", function(event) {
            event.preventDefault(); // Ngăn chặn load lại trang
            forgotPasswordModal.classList.remove("hidden");
        });
    
        // Ẩn modal khi nhấn nút "back"
        backButton.addEventListener("click", function() {
            forgotPasswordModal.classList.add("hidden");
        });
    });

    document.querySelector(".btn").addEventListener("click", function() {
        let userInput = document.querySelector(".input-group input").value;
    
        if (userInput.trim() === "") {
            alert("Vui lòng nhập email hoặc số điện thoại!");
            return;
            
        }
        window.location.href = "login.html";
        // Lưu vào localStorage
        localStorage.setItem("recoveryAccount", userInput);
        
        alert("Thông tin đã được lưu! Quay về trang đăng nhập.");
        
        // Chuyển về trang login.html
        window.location.href = "login.html";
    });   
    document.querySelector(".login-btn").addEventListener("click", function() {
        let storedUser = localStorage.getItem("recoveryAccount"); // Lấy tài khoản đã lưu
        let userInput = document.querySelector("input").value.trim();
    
        if (userInput === "") {
            alert("Vui lòng nhập email hoặc số điện thoại!");
            return;
        }
    
        if (userInput === storedUser) {
            alert("Đăng nhập thành công!");
            window.location.href = "home.html"; // Chuyển đến trang home
        } else {
            alert("Tài khoản không tồn tại hoặc sai thông tin!");
        }
    });
    
    </script>
</body>
</html>
