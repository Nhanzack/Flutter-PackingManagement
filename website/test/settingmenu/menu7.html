<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../home.css">
</head>
<body>
    <header>
        <button class="back-btn" onclick="window.location.href='../home.html'"><i class="fa fa-arrow-left"></i></button>
        <h2 style="text-align: center;">Đổi Mật Khẩu</h2>
    </header>

    <main>
        <div class="content">
            <label>Mật khẩu cũ:</label>
            <input type="password" placeholder="Nhập mật khẩu cũ">
            <label>Mật khẩu mới:</label>
            <input type="password" placeholder="Nhập mật khẩu mới">
            <label>Xác nhận mật khẩu mới:</label>
            <input type="password" placeholder="Xác nhận mật khẩu mới">
            <button onclick="alert('Mật khẩu đã được thay đổi!')">Đổi mật khẩu</button>
        </div>
    </main>
</body>
</html>
