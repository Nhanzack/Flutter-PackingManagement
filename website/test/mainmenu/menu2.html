<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Người Dùng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f4f6fa;
            color: #333;
        }

        /* ======= HEADER ======= */
        header {
            background-color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #005baa;
            cursor: pointer;
            margin-right: 12px;
        }

        header h2 {
            font-size: 18px;
            color: #005baa;
            flex: 1;
            text-align: center;
        }

        main {
            padding: 16px;
        }

        .content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            max-width: 500px;
            margin: 30px auto;
        }

        .content label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .content input[readonly] {
            background-color: #f0f4f8;
            color: #555;
        }

        .content button {
            width: 100%;
            padding: 12px;
            background-color: #005baa;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .content button:hover {
            background-color: #004080;
        }

        @media (max-width: 600px) {
            header h2 {
                font-size: 16px;
            }

            .content {
                padding: 16px;
            }

            .content button {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="window.history.back()">
            <i class="fa fa-arrow-left"></i>
        </button>
        <h2>Thông Tin Người Dùng</h2>
    </header>

    <main>
        <form class="content" id="userForm" enctype="multipart/form-data">
            <div class="avatar-wrapper">
                <img id="avatarPreview" src="../avatar_default.jpg" alt="Avatar">
                <label for="avatarInput"><i class="fa fa-camera"></i></label>
                <input type="file" id="avatarInput" name="avatar" accept="image/*">
            </div>
            
        <div class="content">
            <label>Họ và tên:</label>
            <input type="text" value="Đào Hoàng Nhân" readonly>

            <label>MSSV:</label>
            <input type="text" value="211A290031" readonly>

            <label>Email:</label>
            <input type="email" value="dao.hoang.nhan@vhu.edu.vn">

            <label>Số điện thoại:</label>
            <input type="text" value="0123456789">

            <button onclick="alert('Thông tin đã được gửi để cập nhật!')">Cập nhật</button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const studentId = "211A290031"; // lấy động nếu có hệ thống đăng nhập
        
            fetch(`/api/users/${studentId}`)
                .then(res => res.json())
                .then(data => {
                    document.querySelector('input[type="text"]').value = data.fullName;
                    document.querySelector('input[type="email"]').value = data.email;
                    document.querySelectorAll('input[type="text"]')[1].value = data.phone;
                });
        
            document.querySelector("button").addEventListener("click", function() {
                fetch(`/api/users/${studentId}`, {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document.querySelector('input[type="email"]').value,
                        phone: document.querySelectorAll('input[type="text"]')[1].value
                    })
                })
                .then(() => alert("Thông tin đã được cập nhật!"));
            });
        });
        </script>
        
</body>
</html>
