
    <!DOCTYPE html>
    <html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng Nhập</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="../static/css/js/logstyle.css">
    </head>
    <body>
        <div class="container-login">
            <h2>Đăng Nhập</h2>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" id="username" placeholder="MSSV" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                   
                    <input type="password" id="password" placeholder="Mật khẩu" required>
                </div>
                <div class="links">
                    <a href="#" id="recoverAccountLink">Khôi phục tài khoản</a>
                    <a href="#" id="forgotPasswordLink">Quên Mật Khẩu?</a>
                </div>
                <button type="submit" class="login-btn">Đăng nhập</button>
                <p class="signup">Chưa có tài khoản? <a href="../static/sign up.html">Đăng ký ngay</a></p>
            </form>
        </div>
    
        <!-- Modal Quên Mật Khẩu -->
        <div id="forgotPasswordModal" class="modal hidden">
            <div class="forgotpassword">
                <button class="back-btn" onclick="closeModal('forgotPasswordModal')"><i class="fa fa-arrow-left"></i></button>
                <h2>Khôi phục mật khẩu</h2>
                <p>Nhập số điện thoại để lấy mã OTP</p>
                <div class="input-group">
                    <i class="fa fa-phone"></i>
                    <input type="text" id="phoneForOTP" placeholder="Số điện thoại" required>
                </div>
                <button class="btn" id="sendOTP">Gửi mã OTP</button>
    
                <div class="otp-section hidden">
                    <p>Nhập mã OTP đã gửi đến số điện thoại</p>
                    <div class="input-group">
                        <i class="fa fa-key"></i>
                        <input type="text" id="otp" placeholder="Nhập mã OTP">
                    </div>
                    <button class="btn" id="verifyOTP">Xác nhận</button>
                </div>
    
                <div class="reset-section hidden">
                    <p>Nhập mật khẩu mới</p>
                    <div class="input-group">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="Mật khẩu mới">
                    </div>
                    <button class="btn" id="resetPassword">Đặt lại mật khẩu</button>
                </div>
            </div>
        </div>
        <!-- Modal Khôi Phục Tài Khoản -->
        <div id="recoverAccountModal" class="modal hidden">
            <div class="recover">
                <button class="back-btn" onclick="closeModal('recoverAccountModal')">
                    <i class="fa fa-arrow-left"></i></button>
                <img src="../img/images.png" alt="University Logo" class="logo">
                <h2>Lấy lại tài khoản</h2>
                <p>Nhập email và số điện thoại để nhận mã OTP.</p>
                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="emailForRecover" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-phone"></i>
                    <input type="text" id="phoneForRecover" placeholder="Số điện thoại" required>
                </div>
                <button class="btn" id="recoverConfirm">Xác nhận</button>
            </div>
        </div>
        <script>
            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();
            
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
            
                if (username && password) {
                    // Gửi yêu cầu đăng nhập tới server
                    fetch('/api/login', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Đăng nhập thành công');
                            window.location.href = 'website/static/home.html';
                        } else {
                            alert('Tên đăng nhập hoặc mật khẩu không đúng!');
                        }
                    })
                    .catch(error => console.error('Lỗi:', error));
                } else {
                    alert('Vui lòng nhập đầy đủ thông tin!');
                }
            });
            </script>
        <script src="./css/js/main.js"></script>
    </body>
    </html>
