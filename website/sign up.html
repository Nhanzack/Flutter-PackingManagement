<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: url('./img/10_uu_the_01.jpg') no-repeat center center/cover;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; text-align: center;
        }
        .container {
            background: url(./img/unsplash_cBsKhfU6UUE\ \(1\).png);backdrop-filter: blur(50px); 
            padding: 50px;  
            border-radius: 10px; width: 90%; max-width: 350px;
            color: white; text-align: center;

        }
        .container img {

            width: 150px; margin-bottom: 10px;
        }
        .container h2 { margin-bottom: 10px; }
        .input-group {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px; border-radius: 5px; margin: 10px 0;
        }
        .input-group input {
            border: none; background: transparent; outline: none;
            width: 100%; padding: 5px; color: white;
        }
        .input-group i { margin-right: 10px; color: white; }
        .btn {
            width: 100%; padding: 10px; border: none;
            background: #0D47A1; color: white;
            font-size: 16px; cursor: pointer; border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover { background: #1565C0; }
        .login-link { margin-top: 10px; color: white; font-size: 14px; }
        .login-link a { color: #BBDEFB; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container-signup">
        <img src="./img/images.png" alt="Logo">
        <h2>Chào mừng</h2>
        <p>Đăng ký tài khoản của bạn!</p>
        <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="MSSV">
        </div>
        <div class="input-group">
            <i class="fa fa-envelope"></i>
            <input type="email" placeholder="Email">
        </div>
        <div class="input-group">       
            <i class="fa fa-phone"></i>
            <input type="text" placeholder="Phone number">
        </div>
        <div class="input-group">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Password">
        </div>
        <div class="input-group">
            <i class="fa fa-lock"></i>
            <input type="password" placeholder="Confirm Password">
        </div>
        <button class="btn">Sign Up</button>

        <script> 
            document.querySelector(".btn").addEventListener("click", function() {
                alert("Chuyển đến trang đăng nhập!");
                window.location.href = "login.html";
            });
        </script>
        
        <p class="login-link">Already have an account? <a href="./login.html">Login</a></p>
    </div>
</body>
</html>
